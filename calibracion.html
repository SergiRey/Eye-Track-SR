<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calibración</title><link rel="stylesheet" href="css/estilos.css"></head><body class="oscuro">
<div id="intro" class="centro"><h1>Calibración</h1>
<p>Al empezar, el navegador pedirá permiso para usar la cámara. Aparecerán 9 puntos: mira cada uno y haz clic 5 veces sobre él. Después hay una validación de unos 10 segundos. Verifica que tu rostro se vea completo en el cuadro de video.</p>
<button id="btnIni">Activar cámara y empezar</button></div>
<div id="cal" hidden><div id="dot"></div><div id="txt"></div></div>
<div id="res" class="centro" hidden><h1 id="error" style="font-size:1.4rem"></h1>
<div><button id="btnSig">Continuar a la prueba</button><button id="btnRe" class="sec">Recalibrar</button></div></div>
<script src="js/webgazer.js"></script><script src="js/calibracion.js"></script></body></html>
